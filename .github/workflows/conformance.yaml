# This workflow MUST be audited with zizmor.
# This workflow SHOULD be using pinned action refs.

# Runs the official MCP conformance suite's client scenarios against
# mcp-test-driver, for each revision's frozen requirements list in
# docs/specs/conformance/.  See scripts/conformance-client.sh.

name: Conformance

on:
  pull_request:
    paths:
      - "src/**"
      - "docs/specs/conformance/**"
      - "scripts/conformance-client.sh"
      - ".github/workflows/conformance.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  client:
    name: Client scenarios

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.12"
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the project
        run: uv sync --locked

      - name: Run conformance client scenarios
        run: scripts/conformance-client.sh
