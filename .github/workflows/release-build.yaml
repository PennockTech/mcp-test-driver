# This workflow MUST be audited with zizmor.
# This workflow SHOULD be using pinned action refs.

# The build half of a release, shared so that a dry run (release-check.yaml)
# exercises exactly the steps a tag push will, against the runner image and
# toolcache as they are today.  Publishing stays in release.yaml, the only
# workflow holding the permissions for it.

name: Build release assets

on:
  workflow_call:
    inputs:
      release-tag:
        description: "The tag being released; empty for a dry run, which skips only the tag/version comparison"
        type: string
        required: false
        default: ""

permissions: {}

jobs:

  build:
    name: Build

    runs-on: ubuntu-slim

    permissions:
      contents: read  # to clone repo
      # it seems actions:write for CI artifacts is not needed, it's implicit from $ACTIONS_RUNTIME_TOKEN instead of $GITHUB_TOKEN

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.12"
          # For a release workflow, we disable the cache, to avoid propagating a poisoned cache.
          enable-cache: false

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: "pyproject.toml"

      # setup-python resolves requires-python to the newest Python in the
      # toolcache, which can be newer than any wheel gnureadline has
      # published; uv then builds it from source, linking against ncurses.
      # The runner image has gcc but not the ncurses headers.
      - name: Install build dependencies for source-only wheels
        run: |
          set -eu
          sudo=""
          if [ "$(id -u)" -ne 0 ]; then sudo="sudo"; fi
          $sudo apt-get update -qq
          $sudo apt-get install -y -qq --no-install-recommends libncurses-dev

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # PyPI gets whatever pyproject.toml says, so refuse a tag that disagrees
      # (a hand-made tag, or a manual run against the wrong commit).  uv's own
      # normalisation maps the tag's semver form to PEP 440 (v0.3.0-rc1 -> 0.3.0rc1).
      # A dry run has no tag: between releases the version is a .dev0, so
      # there is nothing it could match.
      - name: Check the tag matches the project version
        run: |
          set -eu
          have="$(uv version --short)"
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::notice::dry run: building ${have}; no tag to compare it with"
            exit 0
          fi
          want="$(uv version --dry-run --short "${RELEASE_TAG#v}")"
          if [ "$want" != "$have" ]; then
            echo "::error::tag ${RELEASE_TAG} means version ${want}, but pyproject.toml has ${have}"
            exit 1
          fi
          echo "Releasing ${have} for tag ${RELEASE_TAG}"
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}

      - name: Build
        run: uv build --no-sources

      - name: Test across Python versions
        run: uv run tox

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist
          path: dist/
